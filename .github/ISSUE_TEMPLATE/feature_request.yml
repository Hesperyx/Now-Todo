name: 功能请求
description: 提议一个新功能或改进
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## 提交前请先读 [产品需求文档](../../blob/main/docs/PRD.md)

        本项目对范围控制很严格。请先确认你的提议属于哪一类：

        - **在 PRD 首版范围内，但还没实现** —— 欢迎，请继续填写。
        - **PRD 里列为「增强项」** —— 也欢迎，但请说明优先级理由。
        - **PRD 明确排除**（账号体系、云同步、多人协作、付费墙、广告）—— 不会被接受。
        - **PRD 没提到的新方向** —— 请重点说明它为什么值得改变产品范围。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前检查
      options:
        - label: 我已阅读 PRD，并确认此提议与产品定位（个人用户、离线优先、无账号、无广告）一致
          required: true
        - label: 我已搜索过现有 Issue，确认没有重复
          required: true

  - type: dropdown
    id: category
    attributes:
      label: 提议类别
      options:
        - PRD 首版范围内，尚未实现
        - PRD 列出的增强项
        - PRD 未提及的新方向
        - 对现有功能的改进
        - 开发者体验 / 工程改进
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的是什么问题
      description: 描述场景与痛点，不要在标题里直接跳到方案
      placeholder: 例如：我经常需要在同一天为多个任务设置提醒，现在每个都要单独打开……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望的方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 包括你考虑过但放弃的做法，以及放弃的原因
    validations:
      required: false

  - type: textarea
    id: impact
    attributes:
      label: 对现有约束的影响
      description: |
        请逐条确认本提议是否触及以下红线。触及的话请说明如何处理：
        - 是否引入网络依赖、账号、云同步？
        - 是否新增系统权限？
        - 是否采集任何用户数据？
        - 是否影响导出格式或数据库迁移？
    validations:
      required: true

  - type: dropdown
    id: contribute
    attributes:
      label: 你是否愿意提交 PR
      options:
        - 愿意，我可以实现
        - 愿意，但需要指导
        - 只想提出建议
    validations:
      required: true
