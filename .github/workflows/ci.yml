name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支上的新推送会取消上一次仍在跑的构建，避免排队。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与本地开发工具链保持一致。升级此版本时，请先确认
  # docs/ARCHITECTURE.md §4 的依赖锁定是否也随之解除。
  FLUTTER_VERSION: '3.35.5'

jobs:
  verify:
    name: 格式 · 分析 · 测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 输出工具链版本
        run: flutter --version

      - name: 拉取依赖
        run: flutter pub get

      # 生成产物（*.g.dart）提交入库，因此必须校验它与源码同步。
      # 项目约定：改了 Drift 表定义就要重跑 build_runner 并提交产物。
      #
      # 只看 lib/ 与 test/：生成产物与迁移夹具都在这两处。不能判整棵工作区——
      # pubspec.lock 的 url 字段记的是「这份依赖从哪个 host 拉下来」，开发机走
      # pub.flutter-io.cn 镜像、CI 走 pub.dev，两边会互相改写这 100 多行，
      # 于是这道门会在「生成产物其实没问题」的时候变红，还把人往 build_runner 上引。
      # 失败时把改动清单塞进 ::error::，GitHub 的注释（check run annotation）能直接读到。
      - name: 校验代码生成产物与源码一致
        run: |
          dart run build_runner build
          if ! git diff --quiet -- lib test; then
            dirty="$(git status --porcelain -- lib test | tr '\n' ',')"
            stat="$(git diff --stat -- lib test | tail -n 6 | tr '\n' ';')"
            echo "::error::build_runner 跑完后 lib/ 或 test/ 有改动，请把产出一起提交。改动：$dirty 统计：$stat"
            git diff --stat -- lib test
            exit 1
          fi

      - name: 格式检查
        run: dart format --output=none --set-exit-if-changed .

      - name: 静态分析
        run: flutter analyze

      - name: 单元测试与 Widget 测试
        run: flutter test --reporter expanded

  android:
    name: Android 构建
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: 构建 Android debug 包
        run: flutter build apk --debug

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: now-todo-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
